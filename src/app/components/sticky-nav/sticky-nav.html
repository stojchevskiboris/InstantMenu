<div class="sticky-nav bg-white border-bottom overflow-x-auto py-2 px-4 no-scrollbar">
    <div class="d-flex flex-nowrap gap-2">
        @for (sub of subCategories(); track sub.id) {
        <a [href]="'#' + sub.id" class="nav-pill text-nowrap"
            [class.active]="activeId === sub.id" (click)="setActive(sub.id)">
            {{ sub.name }}
        </a>
        }
    </div>
</div>
