<div class="sticky-top border-bottom shadow-sm overflow-x-auto py-2 px-3 bg-white no-scrollbar">
    <div class="d-flex flex-nowrap gap-2">
        @for (sub of subCategories(); track sub.id) {
        <a [href]="'#' + sub.id" class="btn btn-sm rounded-pill px-3 py-1 text-nowrap border transition-all"
            [class.btn-dark]="activeId === sub.id" [class.btn-light]="activeId !== sub.id" (click)="setActive(sub.id)">
            {{ sub.name }}
        </a>
        }
    </div>
</div>
