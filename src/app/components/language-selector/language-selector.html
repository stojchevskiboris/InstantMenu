<div class="d-flex align-items-center gap-2">
    <label for="langSelect" class="text-white small m-0">
        {{ uiWords()['select_language'] || 'Language:' }}
    </label>

    <select id="langSelect" class="form-select form-select-sm w-auto" [value]="currentLang()"
        (change)="switchLanguage($any($event.target).value)">

        @for (lang of languages | keyvalue; track lang.key) {
        <option [value]="lang.key">{{ lang.value }}</option>
        }
    </select>
</div>
