@if (!menuService.isFilterMode()) {
  <div class="px-3 pt-2 pb-1 bg-theme-app">
    <div class="toggle-container d-flex p-1 rounded-pill bg-theme-muted" role="tablist">
      @for (category of categories; track category.id) {
        <button
          type="button"
          role="tab"
          class="btn category-btn fw-bold flex-fill rounded-pill border-0 transition-all"
          [attr.aria-selected]="selected() === category.id"
          [class.active]="selected() === category.id"
          (click)="select(category.id)"
        >
          @if (category.id === 'drink') {
            <i class="bi bi-cup-straw me-1" aria-hidden="true"></i>
          } @else if (category.id === 'food') {
            <i class="bi bi-egg-fried me-1" aria-hidden="true"></i>
          }
          {{ category.name | translate }}
        </button>
      }
    </div>
  </div>
}
