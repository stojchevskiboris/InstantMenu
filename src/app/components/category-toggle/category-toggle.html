<div class="px-4 py-3 bg-white">
  <div class="toggle-container p-1 bg-light rounded-pill d-flex">
    @for (category of categories; track $index) {
      <button class="btn flex-fill rounded-pill py-2 fw-bold transition-all border-0"
        [class.active]="selected() === category.id" (click)="select(category.id)">
        {{ category.name }}
      </button>
    }
  </div>
</div>
