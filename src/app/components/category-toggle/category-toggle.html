<div class="px-4 py-2 bg-theme-app">
    <div class="toggle-container d-flex p-1 rounded-pill bg-theme-muted">
        @for (category of categories; track category.id) {
            <button
                class="btn btn-sm flex-fill rounded-pill border-0 transition-all"
                [class.active]="selected() === category.id"
                (click)="select(category.id)">
                {{ languageService.translateObj(category.name) }}
            </button>
        }
    </div>
</div>
