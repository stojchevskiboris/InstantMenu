<div class="card mb-3 border-0 shadow-sm overflow-hidden rounded-4">
  <div class="row g-0">
    <div class="col-8 p-3 d-flex flex-column">
      <div class="d-flex gap-1 mb-2 flex-wrap">
        @for (tag of item().tags; track tag) {
        <span class="badge-tag">{{ tag }}</span>
        }
      </div>
      <h6 class="mb-1 fw-bold text-dark" style="font-size: 1rem;">{{ item().name }}</h6>
      <p class="text-muted mb-3 line-clamp-2" style="font-size: 0.8rem; line-height: 1.4;">{{ item().description }}</p>

      <div class="mt-auto d-flex align-items-center justify-content-between">
        <span class="fw-bold text-dark" style="font-size: 1.05rem;">{{ item().price | currency }}</span>

        <div class="quantity-controls ms-2">
          @if (quantity() > 0) {
          <div class="d-flex align-items-center bg-light rounded-pill p-1">
            <button class="btn-qty" (click)="decrement($event)">
                <i class="bi bi-dash-lg"></i>
            </button>
            <span class="qty-text">{{ quantity() }}</span>
            <button class="btn-qty" (click)="increment($event)">
                <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          } @else {
          <button class="btn btn-dark btn-sm rounded-pill px-4 py-1 fw-bold" style="font-size: 0.85rem;" (click)="increment($event)">
            Add
          </button>
          }
        </div>
      </div>
    </div>
    <div class="col-4 position-relative">
      <div class="image-container h-100 bg-light border-start">
        @if (item().photoUrl) {
        <img [src]="item().photoUrl" class="w-100 h-100 object-fit-cover" [alt]="item().name"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        }
        <div class="placeholder-img w-100 h-100 align-items-center justify-content-center bg-light text-muted p-2 text-center"
          style="font-size: 0.7rem; display: none;">
          {{ item().name }}
        </div>
      </div>
    </div>
  </div>
</div>
