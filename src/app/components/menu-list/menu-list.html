<div class="px-4 pb-5 mt-2">
    @for (sub of subCategories(); track sub.id) {
    <div #categorySection [id]="sub.id" class="mb-5 pt-3 category-section" [class.highlighted]="highlightedId() === sub.id">
        <h5 class="fw-bold mb-4 px-1" style="letter-spacing: -0.01em;">{{ sub.name }}</h5>
        @for (product of sub.items; track product.id) {
        <app-menu-item [item]="product"></app-menu-item>
        }
    </div>
    }
</div>
